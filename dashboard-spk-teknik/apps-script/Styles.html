<style>
  :root {
    --navy-900: #1b4332;
    --navy-800: #2d6a4f;
    --navy-700: #40916c;
    --navy-500: #52b788;
    --ink: #1f2d3d;
    --ink-soft: #5b6b7c;
    --line: #d7dee6;
    --bg: #f2f5f8;
    --white: #ffffff;
    --green: #1f9d55;
    --green-bg: #e6f7ec;
    --amber: #b7791f;
    --amber-bg: #fef6e4;
    --red: #c53030;
    --red-bg: #fdeaea;
    --shadow: 0 1px 2px rgba(27, 67, 50, 0.06), 0 4px 12px rgba(27, 67, 50, 0.06);
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }

  #app.app-shell { display: flex; flex-direction: row; align-items: stretch; min-height: 100vh; }

  /* ---------- Sidebar (ERP-style, collapsible, off-canvas on mobile) ---------- */
  .sidebar {
    width: 272px;
    flex-shrink: 0;
    background: var(--navy-900);
    color: var(--white);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    align-self: flex-start;
    height: 100vh;
    overflow-y: auto;
    transition: width .2s ease;
    z-index: 30;
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 16px;
    border-bottom: 1px solid rgba(255,255,255,.12);
  }
  .sidebar-brand .brand-text { min-width: 0; }
  .brand-mark {
    width: 40px; height: 40px;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--navy-500), var(--navy-700));
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; letter-spacing: .5px;
    overflow: hidden;
  }
  .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
  .brand-text h1 { font-size: 14.5px; line-height: 1.3; margin: 0; font-weight: 600; }
  .brand-text p { font-size: 11px; line-height: 1.35; margin: 4px 0 0; color: #a9d0bd; }

  .sidebar .app-nav {
    flex: 1;
    width: auto;
    display: flex;
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 2px;
    padding: 12px 10px;
    margin-top: 0;
    border-top: none;
  }
  .sidebar .app-nav button {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 9px 10px;
    white-space: nowrap;
    overflow: hidden;
  }
  .sidebar .app-nav button .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
  .sidebar .app-nav button .nav-label { overflow: hidden; text-overflow: ellipsis; }

  .sidebar-collapse-btn {
    margin: 8px 10px 14px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    color: #d9ede2;
    border-radius: 6px;
    padding: 7px;
    cursor: pointer;
    font-size: 13px;
  }

  /* Collapsed: desktop icon-only rail */
  .sidebar.collapsed { width: 64px; }
  .sidebar.collapsed .sidebar-brand { justify-content: center; padding: 18px 8px; }
  .sidebar.collapsed .sidebar-brand .brand-text,
  .sidebar.collapsed .app-nav button .nav-label { display: none; }
  .sidebar.collapsed .app-nav button { justify-content: center; padding: 9px 0; }
  .sidebar.collapsed .sidebar-collapse-btn { transform: rotate(180deg); }

  .app-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .sidebar-backdrop {
    display: none;
    position: fixed; inset: 0;
    background: rgba(27, 67, 50, .5);
    z-index: 29;
  }

  .mobile-nav-toggle {
    display: none;
    width: 34px; height: 34px;
    align-items: center; justify-content: center;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.3);
    color: var(--white);
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }

  /* ---------- Header (topbar meta: clock/sync/refresh/user, nav moved to sidebar) ---------- */
  .topbar {
    background: var(--navy-900);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 14px 24px;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .topbar-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-left: auto; }
  .clock { font-variant-numeric: tabular-nums; font-size: 13px; color: #d9ede2; min-width: 190px; text-align: right; }
  .sync-status { font-size: 11.5px; color: #a8cdb8; }
  .btn-refresh {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.3);
    color: var(--white);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
  }
  .btn-refresh:disabled { opacity: .5; cursor: default; }
  .sync-interval { display: flex; align-items: center; gap: 6px; }
  .sync-interval label { font-size: 11px; color: #a8cdb8; white-space: nowrap; }
  .sync-interval select {
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.3);
    color: var(--white);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
  }
  .sync-interval select option { color: var(--ink); }
  .user-badge {
    font-size: 11px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.2);
    padding: 5px 10px;
    border-radius: 999px;
    color: #d9ede2;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- App nav buttons (base look, laid out by .sidebar .app-nav above) ---------- */
  .app-nav button {
    background: transparent;
    border: 1px solid transparent;
    color: #a9d0bd;
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .app-nav button.active { background: rgba(255,255,255,.16); color: var(--white); border-color: rgba(255,255,255,.25); }

  .view[hidden] { display: none; }
  .master-hint { padding: 10px 2px 0; font-size: 11.5px; color: var(--ink-soft); }
  .master-summary {
    padding: 16px 24px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }
  .master-summary .card { flex: 1 1 200px; min-width: 200px; }
  .master-summary:empty { display: none; }

  /* ---------- Filters ---------- */
  .filters {
    background: var(--white);
    border-bottom: 1px solid var(--line);
    padding: 14px 24px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-end;
    position: sticky;
    top: 68px; /* fallback; overridden by JS (syncStickyOffsets) to match actual topbar height */
    z-index: 15;
    box-shadow: var(--shadow);
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; min-width: 140px; }
  .filter-group-wide { min-width: 220px; flex: 1 1 220px; }
  .filter-search { flex: 1 1 220px; min-width: 200px; }
  .filter-group label { font-size: 11px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  .filter-group select, .filter-group input[type="text"] {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--ink);
    background: var(--white);
    outline: none;
  }
  .filter-group select:focus, .filter-group input[type="text"]:focus { border-color: var(--navy-500); }

  .chip-multiselect { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink-soft);
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  .chip.active { background: var(--navy-700); border-color: var(--navy-700); color: var(--white); }

  .btn-reset {
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    cursor: pointer;
    align-self: flex-end;
  }

  /* ---------- Dashboard sub-tab (Semua/SPK/Purchasing/Home With AI) ---------- */
  #dashboardSubTabs { padding: 16px 24px 0; margin-bottom: 0; }
  .dashboard-subview[hidden] { display: none; }

  /* ---------- Alert row ---------- */
  .alert-row { padding: 16px 24px 0; display: flex; flex-direction: column; gap: 10px; }

  /* ---------- Blok kategori di sub-tab Dashboard "Semua" (SPK/Purchasing/
     Home With AI ditumpuk berurutan, masing-masing pakai .summary-cards/
     .charts-grid yang sama seperti sub-tab kategorinya sendiri) ---------- */
  .dashboard-category-block { margin-top: 22px; }
  .dashboard-category-block:first-of-type { margin-top: 0; }
  .dashboard-category-heading {
    margin: 0; padding: 0 24px;
    font-size: 13px; font-weight: 700; color: var(--navy-800);
    text-transform: uppercase; letter-spacing: .04em;
  }
  .alert-banner {
    background: var(--red-bg);
    border: 1px solid #f3c1c1;
    color: var(--red);
    border-radius: var(--radius);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .alert-banner .alert-icon { font-size: 16px; }

  /* ---------- Alert keterlambatan progres (Dashboard "Semua" + tiap
     sub-tab kategori) -- banner dgn segmen per kategori, klik utk buka
     modal popup (delayModalBackdrop) berisi daftar proyek/unit yang
     terlambat ---------- */
  .alert-banner-delay { flex-direction: column; align-items: stretch; gap: 12px; }
  .alert-banner-summary { display: flex; align-items: center; gap: 10px; }
  .alert-delay-segments { display: flex; flex-wrap: wrap; gap: 10px; }
  .alert-delay-seg {
    display: flex; align-items: center; gap: 8px;
    background: var(--white); border: 1px solid #f3c1c1; color: var(--red);
    border-radius: 999px; padding: 5px 12px; font-size: 12.5px; font-weight: 600;
    cursor: pointer;
  }
  .alert-delay-seg-count { background: var(--red); color: var(--white); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; }

  /* ---------- Summary cards ---------- */
  .summary-cards {
    padding: 16px 24px 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 18px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .card.card-alert { border-color: #f3c1c1; background: var(--red-bg); }
  .card-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); }
  .card-value { font-size: 22px; font-weight: 700; color: var(--navy-900); }
  .card.card-alert .card-value { color: var(--red); }
  .card-sub { font-size: 12px; color: var(--ink-soft); }
  .card-breakdown { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
  .card-breakdown[hidden] { display: none; }
  .card.has-breakdown { cursor: pointer; }
  .card-toggle-icon {
    float: right; color: var(--ink-soft); font-size: 11px;
    transition: transform .15s ease;
  }
  .card.expanded .card-toggle-icon { transform: rotate(90deg); }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-red { background: var(--red-bg); color: var(--red); }
  .badge-gray { background: #eef1f4; color: var(--ink-soft); }

  /* ---------- Charts ---------- */
  .charts-grid {
    padding: 16px 24px 0;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
  }
  .chart-card {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px 16px 10px;
    box-shadow: var(--shadow);
  }
  .chart-card h3 {
    margin: 0 0 10px; font-size: 12.5px; font-weight: 700; color: var(--navy-800);
    text-transform: uppercase; letter-spacing: .03em;
    display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
  }
  .chart-card-wide { grid-column: span 2; }
  .chart-canvas-wrap { position: relative; height: 240px; }
  /* Tabel Peringkat Kontraktor/Vendor (Addendum 21) di dalam .chart-card --
     reuse styling table generik (thead th/tbody td) yang sudah ada, tinggal
     dibungkus supaya tidak melar kalau daftar kontraktor/vendor panjang. */
  .chart-card-table-wrap { max-height: 260px; overflow: auto; }
  .chart-card-table-wrap table { font-size: 12px; }

  /* ---------- Toggle Bulan/Tahun di header chart-card (trend SPK/Purchasing/HWA) ---------- */
  .chart-toggle { display: inline-flex; gap: 2px; text-transform: none; letter-spacing: normal; }
  .chart-toggle button {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 3px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .chart-toggle button.active { background: var(--navy-700); color: var(--white); border-color: var(--navy-700); }
  @media (max-width: 900px) {
    .chart-card-wide { grid-column: span 1; }
  }

  /* ---------- Rincian klik pada chart Status Progres (donut) ---------- */
  .chart-rincian {
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    max-height: 160px; overflow-y: auto;
  }
  .chart-rincian[hidden] { display: none; }
  .chart-rincian-title { font-size: 11px; font-weight: 700; color: var(--ink-soft); margin-bottom: 6px; }
  .chart-rincian-list { display: flex; gap: 6px; flex-wrap: wrap; }
  .chart-rincian-empty { font-size: 12px; color: var(--ink-soft); }

  /* ---------- Table ---------- */
  .table-section { padding: 18px 24px 8px; }
  .table-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .table-tabs button {
    background: var(--white);
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 8px 16px;
    border-radius: 8px 8px 0 0;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border-bottom: none;
  }
  .table-tabs button.active { background: var(--navy-900); color: var(--white); border-color: var(--navy-900); }
  .table-toolbar { display: flex; align-items: center; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .table-toolbar input {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    min-width: 220px;
  }
  .table-toolbar select {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--ink);
    background: var(--white);
  }
  .toolbar-count { margin-left: auto; font-size: 12px; color: var(--ink-soft); }
  .btn-add {
    border: 1px solid var(--navy-500);
    background: var(--navy-500);
    color: var(--white);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-add[hidden] { display: none; }

  /* ---------- Form "Tambah Data" (dalam unit-modal) ---------- */
  .unit-modal-form { max-width: 660px; padding: 32px 36px 36px; }
  .form-modal-title {
    margin: 0 0 20px; padding-bottom: 14px;
    font-size: 17px; font-weight: 700; color: var(--navy-900);
    border-bottom: 1px solid var(--line);
  }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px 24px;
    margin-top: 4px;
  }
  @media (max-width: 560px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  .form-field { display: flex; flex-direction: column; gap: 8px; }
  .form-field.form-field-wide { grid-column: 1 / -1; }
  .form-field label { font-size: 11px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; }
  .form-field label .required-mark { color: var(--red); }
  .form-field input, .form-field select, .form-field textarea {
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 13px;
    font-size: 13.5px;
    font-family: inherit;
    color: var(--ink);
    background: var(--white);
  }
  .form-field textarea { resize: vertical; min-height: 64px; }
  .form-field input:focus, .form-field select:focus, .form-field textarea:focus { border-color: var(--navy-500); outline: none; box-shadow: 0 0 0 3px rgba(82, 183, 136, .12); }
  .form-actions { grid-column: 1 / -1; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
  .btn-primary {
    border: 1px solid var(--navy-700);
    background: var(--navy-700);
    color: var(--white);
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:disabled { opacity: .6; cursor: default; }
  .btn-secondary {
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink-soft);
    padding: 9px 18px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .form-error { color: var(--red); font-size: 12.5px; margin-top: 10px; }
  .multitext-list { display: flex; flex-direction: column; gap: 6px; }
  .multitext-row { display: flex; gap: 6px; }
  .multitext-row input { flex: 1; }
  .multitext-remove {
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink-soft);
    width: 30px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
  }
  .multitext-add {
    align-self: flex-start;
    margin-top: 6px;
    border: 1px dashed var(--line);
    background: var(--white);
    color: var(--navy-500);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  .table-wrap {
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: auto;
    max-height: 520px;
  }
  /* Master Data SPK/Purchasing/Home With AI -- tabel tampil penuh ke
     bawah (tanpa scroll internal terpisah), ikut scroll halaman biasa. */
  .table-wrap.table-wrap-full { max-height: none; overflow: visible; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  thead th {
    position: sticky; top: 0;
    background: #eef2f6;
    color: var(--navy-800);
    text-align: left;
    padding: 9px 12px;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    white-space: nowrap;
  }
  tbody td { padding: 9px 12px; border-bottom: 1px solid #eef1f4; white-space: nowrap; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr { cursor: pointer; }
  tbody tr.row-overdue { background: var(--red-bg); }
  .empty-row td { text-align: center; color: var(--ink-soft); padding: 24px; cursor: default; }

  /* ---------- Footer ---------- */
  .footer-note {
    margin-top: auto;
    padding: 18px 24px 28px;
    font-size: 11.5px;
    color: var(--ink-soft);
    text-align: center;
  }

  /* ---------- Unit detail modal ---------- */
  .unit-modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(27, 67, 50, .45);
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: 40px 16px;
    z-index: 50;
    overflow-y: auto;
  }
  .unit-modal-backdrop.open { display: flex; }
  .unit-modal {
    background: var(--white);
    border-radius: 12px;
    max-width: 760px;
    width: 100%;
    padding: 24px 28px 28px;
    position: relative;
    box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .unit-modal-close {
    position: absolute; top: 14px; right: 16px;
    background: none; border: none;
    font-size: 22px; line-height: 1;
    cursor: pointer; color: var(--ink-soft);
  }
  .unit-header h2 { margin: 0 0 4px; font-size: 18px; color: var(--navy-900); }
  .unit-header p { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
  .unit-section { margin-top: 18px; }
  .unit-section h4 {
    margin: 0 0 8px; font-size: 12px; text-transform: uppercase;
    letter-spacing: .04em; color: var(--navy-700); font-weight: 700;
    border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .unit-item {
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 12.5px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .unit-item-title { font-weight: 700; color: var(--ink); display: flex; justify-content: space-between; gap: 10px; }
  .unit-item-meta { color: var(--ink-soft); }
