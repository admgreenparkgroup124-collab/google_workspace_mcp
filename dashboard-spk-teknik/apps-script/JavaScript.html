  function normKey(s) {
    return String(s || '').trim().toUpperCase().replace(/\s+/g, '');
  }

  function formatRupiah(n) {
    var num = Math.round(Number(n) || 0);
    var neg = num < 0;
    num = Math.abs(num);
    var s = String(num);
    var out = '';
    while (s.length > 3) {
      out = '.' + s.slice(-3) + out;
      s = s.slice(0, -3);
    }
    out = s + out;
    return (neg ? '-' : '') + 'Rp ' + out;
  }

  function formatDate(iso) {
    if (!iso) return '–';
    var parts = iso.split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0];
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Gabung beberapa potongan teks meta (yang kosong dibuang) jadi satu
  // baris dipisah " · ", dipakai di kartu modal Detail per Unit.
  function joinMeta(parts) {
    return parts.filter(function (p) { return p; }).join(' · ');
  }

  function statusBadgeClass(status) {
    var s = (status || '').toLowerCase();
    if (s.indexOf('terpasang') === 0 || s === 'sudah order') return 'badge-green';
    if (s.indexOf('on proses') === 0) return 'badge-amber';
    if (s.indexOf('belum') === 0) return 'badge-gray';
    return 'badge-gray';
  }

    return 'badge-gray';
  }

    if (label === 'Sesuai Jadwal') return 'badge-green';
    return 'badge-gray';
  }

  // ---------------------------------------------------------------------

  function updateClock() {
    var now = new Date();
    try {
      var dateStr = new Intl.DateTimeFormat('id-ID', {
        timeZone: 'Asia/Jakarta', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      }).format(now);
      var timeStr = new Intl.DateTimeFormat('id-ID', {
        timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).format(now);
      document.getElementById('clock').textContent = dateStr + ' · ' + timeStr + ' WIB';
    } catch (e) {
      document.getElementById('clock').textContent = now.toString();
    }
  }
  setInterval(updateClock, 1000);
  updateClock();

  function loadData(showOverlay) {
    if (isLoading) return;
    isLoading = true;
    document.getElementById('loadingOverlay').hidden = !showOverlay;
    document.getElementById('refreshBtn').disabled = true;
    document.getElementById('syncStatus').textContent = 'Menyinkronkan…';

    google.script.run
      .withSuccessHandler(onDataLoaded)
      .withFailureHandler(onDataError)
      .getDashboardData();
  }

  function onDataLoaded(payload) {
    isLoading = false;
    document.getElementById('loadingOverlay').hidden = true;
    document.getElementById('refreshBtn').disabled = false;
    document.getElementById('errorBanner').hidden = true;

    // Notifikasi "data baru" -- bandingkan id baris sebelum & sesudah
    // refresh (manual maupun auto-refresh berkala) supaya PIC/CEO yang
    // sedang membuka dashboard tahu ada input baru dari PIC lain, tanpa
    // perlu reload halaman sendiri. Dilewati pada load pertama (belum ada
    // "data lama" utk dibandingkan).
    var newCount = hasLoadedOnce ? countNewRecords_(rawData, payload) : 0;

    rawData = payload;
    updateSyncStatus();
    populateFilterOptions();
    populateMasterFilterOptions();
    updateAddButtonsVisibility();
    renderCurrentView();
    hasLoadedOnce = true;

    if (newCount > 0) {
      showToast('success', newCount + ' data baru masuk sejak sinkron terakhir.');
    }
  }

  // Hitung baris dgn id yang belum ada di data lama -- dipakai utk
  // notifikasi "data baru" di atas. id tiap record (mis. "GP1-14",
  // "PUR-8") berbasis nomor baris di sheet-nya, stabil selama baris lama
  // tidak dihapus/diurutkan ulang -- konsisten dgn asumsi yang sama yang
  // sudah dipakai `id` di seluruh DataService.gs.
  function countNewRecords_(oldData, newData) {
    function idSet(rows) {
      var s = {};
      (rows || []).forEach(function (r) { s[r.id] = true; });
      return s;
    }
    function countNew(oldRows, newRows) {
      var oldIds = idSet(oldRows);
      var c = 0;
      (newRows || []).forEach(function (r) { if (!oldIds[r.id]) c++; });
      return c;
    }
    return countNew(oldData.spk, newData.spk) +
      countNew(oldData.purchasing, newData.purchasing) +
      countNew(oldData.homeWithAi, newData.homeWithAi) +
      countNew(oldData.pembelianWifi, newData.pembelianWifi) +
      countNew(oldData.progressRealisasi, newData.progressRealisasi);
  }

  function onDataError(err) {
    isLoading = false;
    document.getElementById('loadingOverlay').hidden = true;
    document.getElementById('refreshBtn').disabled = false;
    showToast('error', 'Gagal memuat data: ' + (err && err.message ? err.message : err));
    document.getElementById('syncStatus').textContent = 'Gagal sinkron';
  }

  function updateSyncStatus() {
    if (!rawData.generatedAt) return;
    var d = new Date(rawData.generatedAt);
    var timeStr = new Intl.DateTimeFormat('id-ID', {
      timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).format(d);
    document.getElementById('syncStatus').textContent =
      'Terakhir sinkron: ' + timeStr + ' WIB · auto tiap ' + syncMinutes + ' menit';
  }

  function populateFilterOptions() {
    // Kategori chips (fixed set, keep current active state)
    var katWrap = document.getElementById('filterKategori');
    katWrap.innerHTML = '';
    ['SPK', 'Purchasing', 'Home With AI'].forEach(function (kat) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip' + (filters.kategori[kat] ? ' active' : '');
      chip.textContent = kat;
      chip.addEventListener('click', function () {
        filters.kategori[kat] = !filters.kategori[kat];
        chip.classList.toggle('active');
        renderAll();
      });
      katWrap.appendChild(chip);
    });

    // Tahun
    var tahunSel = document.getElementById('filterTahun');
    var currentTahun = tahunSel.value;
    tahunSel.innerHTML = '<option value="">Semua</option>';
    (rawData.meta.years || []).forEach(function (y) {
      var opt = document.createElement('option');
      opt.value = y;
      opt.textContent = y;
      tahunSel.appendChild(opt);
    });
    tahunSel.value = currentTahun;
    tahunSel.onchange = function () { filters.tahun = tahunSel.value; renderAll(); };

    // Bulan
    var bulanSel = document.getElementById('filterBulan');
    var currentBulan = bulanSel.value;
    bulanSel.innerHTML = '<option value="">Semua</option>';
    MONTHS.forEach(function (name, idx) {
      var opt = document.createElement('option');
      opt.value = idx + 1;
      opt.textContent = name;
      bulanSel.appendChild(opt);
    });
    bulanSel.value = currentBulan;
    bulanSel.onchange = function () { filters.bulan = bulanSel.value; renderAll(); };

    populateGpSelect();
    populateProyekSelect();
  }

  function populateGpSelect() {
    var sel = document.getElementById('filterGp');
    var current = filters.gp;
    sel.innerHTML = '<option value="">Semua</option>';
    (rawData.meta.gpList || []).forEach(function (gp) {
      var opt = document.createElement('option');
      opt.value = gp;
      opt.textContent = gp;
      sel.appendChild(opt);
    });
    sel.value = current;
    sel.onchange = function () {
      filters.gp = sel.value;
      pruneOrphanProyekFilter();
      populateProyekSelect();
      renderAll();
    };
  }

  // gpValue bisa berasal dari nilai display dropdown (sudah persis cocok
  // dengan rawData.meta.gpList) ATAU dari konstanta tab literal seperti
  // "GP1" (dipakai Master Data SPK) yang bisa saja tidak identik dengan
  // teks tampilan di kolom Grup Proyek (lihat catatan inkonsistensi
  // "GP1" vs "GP 2" di README) -- jadi resolve dulu lewat normalizeKey.
  function resolveGpDisplay(gpValue) {
    if (!gpValue) return '';
    var target = normKey(gpValue);
    var found = (rawData.meta.gpList || []).filter(function (g) { return normKey(g) === target; })[0];
    return found || gpValue;
  }

  function proyekOptionsForGp(gpValue) {
    var resolved = resolveGpDisplay(gpValue);
    var set = {};
    var order = [];
    var byGp = rawData.meta.projectsByGp || {};
    var gpsToUse = resolved ? [resolved] : Object.keys(byGp);
    gpsToUse.forEach(function (gp) {
      (byGp[gp] || []).forEach(function (proyek) {
        if (!set[proyek]) { set[proyek] = true; order.push(proyek); }
      });
    });
    return order;
  }

  function availableProyekList() { return proyekOptionsForGp(filters.gp); }

  // Kalau proyek yang lagi dipilih sudah tidak ada di daftar proyek yang
  // tersedia (karena filter GP berubah), reset ke "Semua".
  function pruneOrphanProyekFilter() {
    if (!filters.proyek) return;
    var available = {};
    availableProyekList().forEach(function (p) { available[p] = true; });
    if (!available[filters.proyek]) filters.proyek = '';
  }

  function populateProyekSelect() {
    var sel = document.getElementById('filterProyek');
    var current = filters.proyek;
    sel.innerHTML = '<option value="">Semua</option>';
    availableProyekList().forEach(function (proyek) {
      var opt = document.createElement('option');
      opt.value = proyek;
      opt.textContent = proyek;
      sel.appendChild(opt);
    });
    sel.value = current;
    sel.onchange = function () { filters.proyek = sel.value; renderAll(); };
  }

  // ---------------------------------------------------------------------
  // Filtering
  // ---------------------------------------------------------------------
  function passesCommonFilters(rec, kategoriKey) {
    if (!filters.kategori[kategoriKey]) return false;
    if (filters.tahun && String(rec.tahun || '') !== String(filters.tahun)) return false;
    if (filters.bulan && String(rec.bulan || '') !== String(filters.bulan)) return false;
    if (filters.gp && normKey(rec.gp) !== normKey(filters.gp)) return false;
    if (filters.proyek && normKey(rec.proyek) !== normKey(filters.proyek)) return false;

    if (filters.search) {
      var haystack = JSON.stringify(rec).toLowerCase();
      if (haystack.indexOf(filters.search.toLowerCase()) === -1) return false;
    }
    return true;
  }

  function getFilteredSpk() { return rawData.spk.filter(function (r) { return passesCommonFilters(r, 'SPK'); }); }
  function getFilteredHomeWithAi() { return rawData.homeWithAi.filter(function (r) { return passesCommonFilters(r, 'Home With AI'); }); }
  function getFilteredPurchasing() { return rawData.purchasing.filter(function (r) { return passesCommonFilters(r, 'Purchasing'); }); }

  // ---------------------------------------------------------------------
  // Render orchestration
  // ---------------------------------------------------------------------
  // Dispatch berdasar sub-tab Dashboard yang aktif (Semua/SPK/Purchasing/
  // Home With AI) -- tab "Semua" perilakunya identik dengan sebelum
  // sub-tab ini ada (renderSummary+renderCharts+renderTable gabungan).
  // Sub-tab "Semua" = gabungan renderSpkOverview/renderPurchasingOverview/
  // renderHwaOverview apa adanya, render ke elemen id lain (prefix
  // "semua...") supaya tidak bentrok dgn elemen id sub-tab kategori
  // sendiri -- lihat markup #dashboardSubview-semua di Index.html.
  var SEMUA_SPK_IDS = { cards: 'semuaSpkSummaryCards', tren: 'chartSemuaSpkTren', trenKey: 'semuaSpkTren', status: 'chartSemuaSpkStatus', statusKey: 'semuaSpkStatus', statusDetails: 'semuaSpkStatusRincian' };
  var SEMUA_PUR_IDS = { cards: 'semuaPurSummaryCards', tren: 'chartSemuaPurTren', trenKey: 'semuaPurTren', status: 'chartSemuaPurStatus', statusKey: 'semuaPurStatus', statusDetails: 'semuaPurStatusRincian' };
  var SEMUA_HWA_IDS = { cards: 'semuaHwaSummaryCards', tren: 'chartSemuaHwaTren', trenKey: 'semuaHwaTren', status: 'chartSemuaHwaStatus', statusKey: 'semuaHwaStatus', statusDetails: 'semuaHwaStatusRincian' };

  function renderAll() {
    var fSpk = getFilteredSpk();
    var fHwa = getFilteredHomeWithAi();
    var fPur = getFilteredPurchasing();
    var delayGroups = computeDelayGroups_(fSpk, fPur, fHwa);

    if (dashboardSubTab === 'spk') {
      renderDelayAlert('spkAlertRow', delayGroups, ['spk']);
      renderSpkOverview(fSpk);
    } else if (dashboardSubTab === 'purchasing') {
      renderDelayAlert('purAlertRow', delayGroups, ['purchasing']);
      renderPurchasingOverview(fPur);
    } else if (dashboardSubTab === 'hwa') {
      renderDelayAlert('hwaAlertRow', delayGroups, ['homeWithAi']);
      renderHwaOverview(fHwa);
    } else {
      renderDelayAlert('alertRow', delayGroups, ['spk', 'purchasing', 'homeWithAi']);
      renderSpkOverview(fSpk, SEMUA_SPK_IDS);
      renderPurchasingOverview(fPur, SEMUA_PUR_IDS);
      renderHwaOverview(fHwa, SEMUA_HWA_IDS);
      renderTable(fSpk, fHwa, fPur);
    }
  }

  document.getElementById('dashboardSubTabs').addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-subtab]');
    if (!btn) return;
    dashboardSubTab = btn.getAttribute('data-subtab');
    document.querySelectorAll('#dashboardSubTabs button').forEach(function (b) { b.classList.toggle('active', b === btn); });
    document.querySelectorAll('.dashboard-subview').forEach(function (el) { el.hidden = (el.id !== 'dashboardSubview-' + dashboardSubTab); });
    document.getElementById('filterKategoriGroup').hidden = (dashboardSubTab !== 'semua');
    renderAll();
  });

  // Toggle Bulan/Tahun generik pada chart-card trend (SPK/Purchasing/Home
  // With AI di sub-tab masing-masing punya toggle sendiri, ditandai
  // `data-toggle-group` yang cocok dgn salah satu var granularity di atas).
  // Sub-tab "Semua" & sub-tab kategorinya sendiri pakai `data-toggle-group`
  // yang SAMA (mis. "spkTrend" dipakai baik oleh blok SPK di "Semua" maupun
  // sub-tab "SPK" sendiri) krn keduanya nunjukin data yg sama -- klik di
  // manapun harus menyamakan kedua toggle itu, jadi cari SEMUA grup dgn key
  // yg sama (bukan cuma grup yg diklik) supaya keduanya tetap sinkron.
  document.querySelectorAll('.chart-toggle').forEach(function (group) {
    group.addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-granularity]');
      if (!btn) return;
      var granularity = btn.getAttribute('data-granularity');
      var key = group.getAttribute('data-toggle-group');
      document.querySelectorAll('.chart-toggle[data-toggle-group="' + key + '"] button').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-granularity') === granularity);
      });
      if (key === 'spkTrend') spkTrendGranularity = granularity;
      else if (key === 'purTrend') purTrendGranularity = granularity;
      else if (key === 'hwaTrend') hwaTrendGranularity = granularity;
      renderAll();
    });
  });

  // ---------------------------------------------------------------------
  // Card grid generik -- dipakai renderSummary (tab Semua) + overview per
  // kategori (renderSpkOverview/renderPurchasingOverview/renderHwaOverview)
  // + renderMasterSummary di halaman Master Data.
  // ---------------------------------------------------------------------
  function renderCardGrid(elId, cards) {
    var wrap = document.getElementById(elId);
    wrap.innerHTML = '';
    cards.forEach(function (c) {
      var el = document.createElement('div');
      el.className = 'card' + (c.alert ? ' card-alert' : '') + (c.breakdown ? ' has-breakdown' : '');
      el.innerHTML =
        '<div class="card-label">' + escapeHtml(c.label) + (c.breakdown ? '<span class="card-toggle-icon">▸</span>' : '') + '</div>' +
        '<div class="card-value">' + escapeHtml(String(c.value)) + '</div>' +
        (c.sub ? '<div class="card-sub">' + escapeHtml(c.sub) + '</div>' : '') +
        (c.breakdown ? '<div class="card-breakdown" hidden>' + c.breakdown + '</div>' : '');
      if (c.breakdown) {
        el.addEventListener('click', function () {
          var bd = el.querySelector('.card-breakdown');
          var willShow = bd.hidden;
          bd.hidden = !willShow;
          el.classList.toggle('expanded', willShow);
        });
      }
      wrap.appendChild(el);
    });
  }

  // Breakdown pill list generik (dipakai renderSummary + overview per
  // kategori) -- kelompokkan `rows` berdasar `keyFn`, hitung count & total
  // nilai (`valueFn`) per kelompok, kembalikan { order, countPills,
  // nilaiPills } siap ditempel ke card.breakdown.
  function buildBreakdown(rows, keyFn, valueFn, pillClassFn, itemLabelFn) {
    var order = [];
    var count = {};
    var nilai = {};
    var items = {};
    rows.forEach(function (r) {
      var k = keyFn(r) || '(Tidak diisi)';
      if (count[k] === undefined) { count[k] = 0; nilai[k] = 0; items[k] = []; order.push(k); }
      count[k]++;
      nilai[k] += valueFn(r);
      if (itemLabelFn) items[k].push(itemLabelFn(r));
    });
    function pill(k, text) {
      var cls = pillClassFn ? pillClassFn(k) : 'badge-gray';
      return '<span class="badge ' + cls + '">' + escapeHtml(k) + ': ' + text + '</span>';
    }
    return {
      order: order,
      count: count,
      nilai: nilai,
      items: items,
      countPills: order.map(function (k) { return pill(k, count[k]); }).join(''),
      nilaiPills: order.map(function (k) { return pill(k, formatRupiah(nilai[k])); }).join('')
    };
  }

  // Rincian nama (dipakai card tanpa breakdown pill count/nilai, mis. Total
  // Proyek & Unit Tertinggal Jadwal Konstruksi) -- daftar nama unik jadi
  // badge biasa (bukan pasangan label:nilai spt buildBreakdown).
  function buildNamePills(names) {
    return names.map(function (n) { return '<span class="badge badge-gray">' + escapeHtml(n) + '</span>'; }).join('');
  }

  // Rincian klik pada chart Status Progres (donut) -- tampilkan daftar nama
  // baris yang termasuk status/segmen yang diklik, di container di bawah
  // chart. `itemsByLabel` opsional: { label: [nama1, nama2, ...] }.
  function showChartRincian_(detailsElId, label, itemsByLabel) {
    if (!detailsElId) return;
    var el = document.getElementById(detailsElId);
    if (!el) return;
    var items = (itemsByLabel && itemsByLabel[label]) || [];
    if (!items.length) {
      el.innerHTML = '<div class="chart-rincian-empty">Tidak ada data untuk "' + escapeHtml(label) + '".</div>';
    } else {
      el.innerHTML = '<div class="chart-rincian-title">' + escapeHtml(label) + ' (' + items.length + ')</div>' +
        '<div class="chart-rincian-list">' + buildNamePills(items) + '</div>';
    }
    el.hidden = false;
  }

  // ---------------------------------------------------------------------
  // Alert keterlambatan progres (Dashboard "Semua" + tiap sub-tab kategori)
  // -- sumbernya PERSIS flag yang sama dgn highlight baris merah di Master
  // Data SPK/Purchasing/Home With AI (row.isOverdue utk SPK Unit Rumah,
  // row.slaOverdue utk ketiga kategori kalau Target Hari SLA-nya sudah
  // terisi & terlewati). Beda dari card "Unit Tertinggal Jadwal
  // Konstruksi" (Addendum 8, berbasis progres realisasi mingguan/Kurva S)
  // yang sudah ada di blok SPK -- dua sinyal terpisah, sengaja tidak
  // digabung.
  // ---------------------------------------------------------------------
  function computeDelayGroups_(fSpk, fPur, fHwa) {
    return {
      spk: {
        label: 'SPK',
        rows: fSpk.filter(function (r) { return r.isOverdue || r.slaOverdue; })
      },
      purchasing: {
        label: 'Purchasing',
        rows: fPur.filter(function (r) { return r.slaOverdue; })
      },
      homeWithAi: {
        label: 'Home With AI',
        rows: fHwa.filter(function (r) { return r.slaOverdue; })
      }
    };
  }

  // `keys` menentukan kategori mana yang ditampilkan di container ini --
  // ['spk','purchasing','homeWithAi'] utk banner gabungan di "Semua",
  // atau satu key saja utk banner khusus tiap sub-tab kategori. Tiap
  // kategori jadi segmen yang bisa diklik utk buka modal popup berisi
  // daftar proyek/unit yang terlambat (mirip modal Riwayat Detail per
  // Unit -- lihat openDelayModal_ di bawah).
  function renderDelayAlert(containerId, groups, keys) {
    var el = document.getElementById(containerId);
    if (!el) return;
    el.innerHTML = '';
    var totalCount = keys.reduce(function (sum, k) { return sum + groups[k].rows.length; }, 0);
    if (totalCount === 0) { el.hidden = true; return; }
    el.hidden = false;

    var banner = document.createElement('div');
    banner.className = 'alert-banner alert-banner-delay';

    var summary = document.createElement('div');
    summary.className = 'alert-banner-summary';
    summary.innerHTML = '<span class="alert-icon">⚠️</span><span>' + totalCount +
      ' proses terlambat (target Tanggal Selesai / Target Hari SLA terlewati).</span>';
    banner.appendChild(summary);

    var segWrap = document.createElement('div');
    segWrap.className = 'alert-delay-segments';
    keys.forEach(function (k) {
      var g = groups[k];
      if (!g.rows.length) return;

      var seg = document.createElement('button');
      seg.type = 'button';
      seg.className = 'alert-delay-seg';
      seg.innerHTML = '<span>' + escapeHtml(g.label) + '</span><span class="alert-delay-seg-count">' + g.rows.length + '</span>';
      seg.addEventListener('click', function () { openDelayModal_(k, g); });

      segWrap.appendChild(seg);
    });
    banner.appendChild(segWrap);
    el.appendChild(banner);
  }

  // Judul & alasan keterlambatan tiap baris -- dipakai openDelayModal_ di
  // bawah, pola persis .unit-item/.unit-item-title/.unit-item-meta yang
  // sudah dipakai modal Riwayat (openUnitDetail).
  function delayItemTitle_(groupKey, r) {
    var unitPart = (r.proyek || '-') + (r.unit ? ' – ' + r.unit : '');
    if (groupKey === 'spk') return (r.noSpk || '-') + ' — ' + unitPart;
    if (groupKey === 'purchasing') return (r.namaBarang || '-') + ' — ' + unitPart;
    return unitPart; // homeWithAi
  }
  function delayItemValue_(groupKey, r) {
    return groupKey === 'spk' ? r.nilaiTotal : r.nilai;
  }
  function delayReasonMeta_(r) {
    var lines = [];
    if (r.isOverdue) {
      lines.push('Overdue: melewati target Tanggal Selesai (' + formatDate(r.tanggalSelesaiEfektif) + ')');
    }
    if (r.slaOverdue) {
      lines.push('SLA terlambat: target ' + formatDate(r.slaTargetDate) +
        ' · mulai ' + formatDate(r.slaStartDate) +
        ' · target ' + r.slaTargetHari + ' hari · sudah ' + r.slaElapsedHari + ' hari berjalan');
    }
    return lines;
  }

  // Modal popup daftar keterlambatan per kategori (dipicu klik segmen di
  // renderDelayAlert) -- backdrop TERPISAH dari unitModalBackdrop (Detail
  // per Unit) supaya kedua modal tidak berebut state kalau user buka
  // Riwayat unit dari sini nanti.
  function openDelayModal_(groupKey, group) {
    var html = '<div class="unit-header"><h2>Keterlambatan — ' + escapeHtml(group.label) + '</h2>' +
      '<p>' + group.rows.length + ' proses terlambat</p></div>';
    html += '<div class="unit-section">';
    html += group.rows.map(function (r) {
      var reasonLines = delayReasonMeta_(r);
      return '<div class="unit-item">' +
        '<div class="unit-item-title"><span>' + escapeHtml(delayItemTitle_(groupKey, r)) + '</span>' +
        '<span>' + formatRupiah(delayItemValue_(groupKey, r)) + '</span></div>' +
        reasonLines.map(function (l) { return '<div class="unit-item-meta">' + escapeHtml(l) + '</div>'; }).join('') +
        '</div>';
    }).join('');
    html += '</div>';

    document.getElementById('delayModalContent').innerHTML = html;
    document.getElementById('delayModalBackdrop').classList.add('open');
  }
  document.getElementById('delayModalClose').addEventListener('click', closeDelayModal_);
  document.getElementById('delayModalBackdrop').addEventListener('click', function (e) {
    if (e.target === document.getElementById('delayModalBackdrop')) closeDelayModal_();
  });
  function closeDelayModal_() {
    document.getElementById('delayModalBackdrop').classList.remove('open');
  }

  // ---------------------------------------------------------------------
  // Charts
  // ---------------------------------------------------------------------
  var PALETTE = ['#2d6a4f', '#1b4332', '#52b788', '#95d5b2', '#0b3d2b', '#b7e4c7'];
  var STATUS_COLORS = { 'Belum Order': '#94b0a3', 'On Proses': '#b7791f', 'Terpasang': '#1f9d55' };

  function destroyChart(key) {
    if (charts[key]) { charts[key].destroy(); delete charts[key]; }
  }

  // ---------------------------------------------------------------------
  // Chart baru khusus dashboard sub-tab per kategori (Trend count per
  // bulan, Status Progres) -- tidak ada versi lama yang bisa dipakai ulang.
  // ---------------------------------------------------------------------
  // granularity: 'month' (default, satu titik per bulan-tahun, mis. "Jan
  // 2026") atau 'year' (satu titik per tahun, jumlah seluruh baris tahun
  // itu) -- dipakai chart trend SPK/Purchasing/Home With AI yang masing-
  // masing punya toggle Bulan/Tahun sendiri (lihat .chart-toggle).
  function renderTrendCountChart(canvasId, chartKey, rows, dateKey, label, color, granularity) {
    granularity = granularity || 'month';
    destroyChart(chartKey);
    var map = {};
    rows.forEach(function (r) {
      var iso = r[dateKey];
      if (!iso) return;
      var key = granularity === 'year' ? iso.slice(0, 4) : iso.slice(0, 7); // 'YYYY' atau 'YYYY-MM'
      if (!map[key]) map[key] = 0;
      map[key] += 1;
    });
    var keys = Object.keys(map).sort();
    var labels = granularity === 'year' ? keys : keys.map(function (k) {
      var parts = k.split('-');
      return MONTHS[parseInt(parts[1], 10) - 1].slice(0, 3) + ' ' + parts[0];
    });
    var values = keys.map(function (k) { return map[k]; });
    var ctx = document.getElementById(canvasId).getContext('2d');
    charts[chartKey] = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: [{ label: label, data: values, borderColor: color, backgroundColor: 'transparent', tension: 0.25, pointRadius: 3 }] },
      options: baseBarOptions('Jumlah')
    });
  }

  // `itemsByLabel`/`detailsElId` opsional: kalau diisi, klik potongan donut
  // ATAU klik legend-nya menampilkan daftar nama baris untuk status itu di
  // container `detailsElId` (lihat showChartRincian_) -- interaktif, tidak
  // sekadar tooltip hover.
  function renderStatusProportionChart(canvasId, chartKey, labels, values, colors, itemsByLabel, detailsElId) {
    destroyChart(chartKey);
    var ctx = document.getElementById(canvasId).getContext('2d');
    function onPick(idx) {
      if (idx == null || idx < 0) return;
      showChartRincian_(detailsElId, labels[idx], itemsByLabel);
    }
    charts[chartKey] = new Chart(ctx, {
      type: 'doughnut',
      data: { labels: labels, datasets: [{ data: values, backgroundColor: colors }] },
      options: {
        responsive: true, maintainAspectRatio: false,
        onClick: function (evt, elements) {
          if (elements && elements.length) onPick(elements[0].index);
        },
        plugins: {
          legend: {
            position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } },
            onClick: function (evt, legendItem) { onPick(legendItem.index); }
          }
        }
      }
    });
  }

  // ---- Overview SPK (dashboard sub-tab SPK, dan dipakai ulang di sub-tab
  // "Semua" -- ids opsional supaya kartu/chart-nya render ke elemen yang
  // berbeda tanpa duplikasi logic; default ke id sub-tab SPK sendiri) ----
  function renderSpkOverview(fSpk, ids) {
    ids = ids || { cards: 'spkSummaryCards', tren: 'chartSpkTrenPenerbitan', trenKey: 'spkTrenPenerbitan', status: 'chartSpkStatusProgres', statusKey: 'spkStatusProgres', statusDetails: 'spkStatusRincian' };
    var totalNilai = fSpk.reduce(function (s, r) { return s + r.nilaiTotal; }, 0);
    var overdueCount = fSpk.filter(function (r) { return r.isOverdue; }).length;
    var jenis = buildBreakdown(fSpk, function (r) { return r.jenisSpk; }, function (r) { return r.nilaiTotal; });
    var totalProyek = {}; var proyekNames = [];
    fSpk.forEach(function (r) {
      if (!r.proyek) return;
      var k = normKey(r.proyek);
      if (!totalProyek[k]) { totalProyek[k] = true; proyekNames.push(r.proyek); }
    });

    // Unit tertinggal jadwal konstruksi (Addendum 8) -- dedup per unitKey
    // (satu unit bisa punya >1 baris SPK), dihitung dari unit-unit yang
    // sedang tampil di filter Dashboard saat ini.
    var seenUnitKeys = {};
    var behindCount = 0;
    var behindNames = [];
    fSpk.forEach(function (r) {
      if (!r.unitKey || seenUnitKeys[r.unitKey]) return;
      seenUnitKeys[r.unitKey] = true;
      var status = computeUnitProgressStatus_(r.unitKey);
      if (status && status.isBehind) {
        behindCount++;
        behindNames.push((r.proyek || '-') + (r.unit ? ' – ' + r.unit : ''));
      }
    });

    var spkStatusItems = { 'Sesuai Jadwal': [], 'Overdue': [] };
    fSpk.forEach(function (r) {
      var label = r.isOverdue ? 'Overdue' : 'Sesuai Jadwal';
      spkStatusItems[label].push((r.proyek || '-') + (r.unit ? ' – ' + r.unit : ''));
    });

    renderCardGrid(ids.cards, [
      { label: 'Total Proyek', value: Object.keys(totalProyek).length, breakdown: buildNamePills(proyekNames) },
      { label: 'Total SPK', value: fSpk.length, sub: overdueCount + ' overdue (Unit Rumah)', breakdown: jenis.countPills },
      { label: 'Total Nilai Transaksi', value: formatRupiah(totalNilai), breakdown: jenis.nilaiPills },
      { label: 'Unit Tertinggal Jadwal Konstruksi', value: behindCount, sub: 'Realisasi kumulatif di bawah rencana s/d minggu berjalan', alert: behindCount > 0, breakdown: buildNamePills(behindNames) }
    ]);

    renderTrendCountChart(ids.tren, ids.trenKey, fSpk, 'tanggalTerbit', 'Jumlah SPK Terbit', '#40916c', spkTrendGranularity);
    renderStatusProportionChart(ids.status, ids.statusKey,
      ['Sesuai Jadwal', 'Overdue'], [fSpk.length - overdueCount, overdueCount], ['#1f9d55', '#c53030'],
      spkStatusItems, ids.statusDetails);
  }

  // ---- Overview Purchasing (dashboard sub-tab Purchasing + "Semua") ----
  function renderPurchasingOverview(fPur, ids) {
    ids = ids || { cards: 'purSummaryCards', tren: 'chartPurTren', trenKey: 'purTren', status: 'chartPurStatus', statusKey: 'purStatus', statusDetails: 'purStatusRincian' };
    var totalNilai = fPur.reduce(function (s, r) { return s + r.nilai; }, 0);
    var jenis = buildBreakdown(fPur, function (r) { return r.jenisPengadaan; }, function (r) { return r.nilai; });
    var itemLabel = function (r) { return (r.proyek || '-') + (r.unit ? ' – ' + r.unit : '') + ' (' + (r.namaBarang || '-') + ')'; };
    var status = buildBreakdown(fPur, function (r) { return r.statusPekerjaan; }, function () { return 0; }, null, itemLabel);

    renderCardGrid(ids.cards, [
      { label: 'Total PO Purchasing', value: fPur.length, breakdown: jenis.countPills },
      { label: 'Total Nilai PO Purchasing', value: formatRupiah(totalNilai), breakdown: jenis.nilaiPills }
    ]);

    renderTrendCountChart(ids.tren, ids.trenKey, fPur, 'tanggalMulai', 'Jumlah PO', '#40916c', purTrendGranularity);
    renderStatusProportionChart(ids.status, ids.statusKey,
      status.order, status.order.map(function (k) { return status.count[k]; }), PALETTE,
      status.items, ids.statusDetails);
  }

  // ---- Overview Home With AI (dashboard sub-tab Home With AI + "Semua") ----
  function renderHwaOverview(fHwa, ids) {
    ids = ids || { cards: 'hwaSummaryCards', tren: 'chartHwaTren', trenKey: 'hwaTren', status: 'chartHwaStatusProgres', statusKey: 'hwaStatusProgres', statusDetails: 'hwaStatusRincian' };
    var totalNilai = fHwa.reduce(function (s, r) { return s + r.nilai; }, 0);
    var itemLabel = function (r) { return (r.proyek || '-') + (r.unit ? ' – ' + r.unit : ''); };
    var status = buildBreakdown(fHwa, function (r) { return r.status; }, function (r) { return r.nilai; }, statusBadgeClass, itemLabel);
    // Breakdown Home With AI vs Smarthome (Addendum 9) -- kategori kosong
    // sudah di-fallback ke 'HOME WITH AI' di getHomeWithAiRows_.
    var kategori = buildBreakdown(fHwa, function (r) { return r.kategori; }, function (r) { return r.nilai; }, null, itemLabel);

    renderCardGrid(ids.cards, [

  // ---------------------------------------------------------------------
  // Table (generic builder, dipakai tabel Dashboard + ketiga tabel Master Data)
  // ---------------------------------------------------------------------
  function buildDataTable(opts) {
    // opts: theadEl, tbodyEl, countEl, rows, columns, sortState, search, onHeaderClick, onRowClick
    var rows = opts.rows.slice();
    var columns = opts.columns;
    var sortState = opts.sortState;

    if (opts.search) {
      var q = opts.search.toLowerCase();
      rows = rows.filter(function (r) { return JSON.stringify(r).toLowerCase().indexOf(q) !== -1; });
    }

    if (sortState.key) {
      rows.sort(function (a, b) {
        var av = a[sortState.key], bv = b[sortState.key];
        if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortState.dir;
        av = String(av || ''); bv = String(bv || '');
        return av.localeCompare(bv) * sortState.dir;
      });
    }

    opts.theadEl.innerHTML = '';
    var headRow = document.createElement('tr');
    columns.forEach(function (col) {
      var th = document.createElement('th');
      var arrow = sortState.key === col.key ? (sortState.dir === 1 ? ' ▲' : ' ▼') : '';
      th.textContent = col.label + arrow;
      th.addEventListener('click', function () {
        if (sortState.key === col.key) sortState.dir *= -1;
        else { sortState.key = col.key; sortState.dir = 1; }
        opts.onHeaderClick();
      });
      headRow.appendChild(th);
    });
    opts.theadEl.appendChild(headRow);

    opts.tbodyEl.innerHTML = '';

    if (!rows.length) {
      var emptyRow = document.createElement('tr');
      emptyRow.className = 'empty-row';
      var td = document.createElement('td');
      td.colSpan = columns.length;
      td.textContent = 'Tidak ada data untuk filter saat ini.';
      emptyRow.appendChild(td);
      opts.tbodyEl.appendChild(emptyRow);
    } else {
      rows.forEach(function (r) {
        var tr = document.createElement('tr');
        if (r.isOverdue || r.slaOverdue || r.isBehindSchedule || r.wifiOverdue) tr.className = 'row-overdue';
        columns.forEach(function (col) {
          var td = document.createElement('td');
          var val = r[col.key];
          if (col.editable && r.canEditSla && opts.onCellEdit) {
            var input = document.createElement('input');
            input.type = 'number';
            input.min = '0';
            input.step = '1';
            input.className = 'sla-edit-input';
            if (val != null) input.value = val;
            input.placeholder = '–';
            input.addEventListener('click', function (e) { e.stopPropagation(); });
            input.addEventListener('change', function () {
              var raw = input.value.trim();
              if (raw === '') return;
              var num = Number(raw);
              if (!isFinite(num) || num < 0) {
                showToast('error', 'Target Hari harus angka >= 0.');
                input.value = val != null ? val : '';
                return;
              }
              input.disabled = true;
              opts.onCellEdit(r, num, function () { input.disabled = false; });
            });
            td.appendChild(input);
          } else if (col.format === 'currency') td.textContent = formatRupiah(val);
          else if (col.format === 'overdue') td.innerHTML = val ? '<span class="badge badge-red">Overdue</span>' : '<span class="badge badge-green">Sesuai Jadwal</span>';
          else if (col.format === 'hwaStatus') td.innerHTML = '<span class="badge ' + statusBadgeClass(val) + '">' + escapeHtml(val) + '</span>';
          else if (col.format === 'slaStatus') td.innerHTML = '<span class="badge ' + slaStatusBadgeClass(val) + '">' + escapeHtml(val) + '</span>';
          else if (col.format === 'progressStatus') td.innerHTML = '<span class="badge ' + progressStatusBadgeClass(val) + '">' + escapeHtml(val) + '</span>';
          else if (col.format === 'date' || col.key.indexOf('tanggal') === 0) td.textContent = formatDate(val);
          else td.textContent = val === '' || val == null ? '–' : val;
          tr.appendChild(td);
        });
        if (r.unitKey && opts.onRowClick) {
          tr.addEventListener('click', function () { opts.onRowClick(r); });
        } else {
          tr.style.cursor = 'default';
        }
        opts.tbodyEl.appendChild(tr);
      });
    }

    opts.countEl.textContent = rows.length + ' baris';
  }

  function slaStatusLabel(r) {
    if (r.slaDone) return 'Selesai';
    if (r.slaOverdue) return 'Overdue';
    if (!r.slaStartDate) return 'Belum Ada Tanggal Mulai';
    return 'On Track';
  }

  // Bangun baris gabungan dari 3 array yang sudah ada di rawData. Berbeda
  // dari desain lama (SLA Config per kategori): SEMUA baris ditampilkan di
  // sini, termasuk yang Target Hari-nya belum diisi -- supaya PIC terkait
  // bisa langsung mengisinya lewat kolom "Target (Hari)" yang editable
  // (lihat MASTER_SLA_COLUMNS/buildDataTable). recordType/underlyingId
  // dibawa serta supaya onCellEdit tahu ke mana harus menulis balik.
  function buildSlaRows() {
    var rows = [];
    rawData.spk.forEach(function (r) {
      if (!r.slaStartDate) return; // tanpa Tanggal Terbit, tidak ada titik awal SLA
      rows.push({
        id: 'sla-spk-' + r.id, recordType: 'spk', underlyingId: r.id,
        kategori: 'SPK', jenis: r.jenisSpk,
        gp: r.gp, proyek: r.proyek, unit: r.unit, unitKey: r.unitKey, ref: r.noSpk,
        slaStartDate: r.slaStartDate, slaTargetHari: r.slaTargetHari,
        slaElapsedHari: r.slaElapsedHari, slaOverdue: r.slaOverdue, slaDone: r.slaDone,
        canEditSla: r.canEditSla
      });
    });
    rawData.purchasing.forEach(function (r) {
      if (!r.slaStartDate) return; // tanpa Tanggal Order/Mulai, tidak ada titik awal SLA
      rows.push({
        id: 'sla-pur-' + r.id, recordType: 'purchasing', underlyingId: r.id,
        kategori: 'Purchasing', jenis: r.jenisPengadaan,
        gp: r.gp, proyek: r.proyek, unit: r.unit, unitKey: r.unitKey, ref: r.namaBarang,
        slaStartDate: r.slaStartDate, slaTargetHari: r.slaTargetHari,
        slaElapsedHari: r.slaElapsedHari, slaOverdue: r.slaOverdue, slaDone: r.slaDone,
        canEditSla: r.canEditSla
      });
    });
    rawData.homeWithAi.forEach(function (r) {
      if (!r.slaStartDate) return; // tanpa Tanggal Order/Mulai, tidak ada titik awal SLA
      rows.push({
        id: 'sla-hwa-' + r.id, recordType: 'homeWithAi', underlyingId: r.id,
        kategori: 'Home With AI', jenis: '-',
        gp: r.gp, proyek: r.proyek, unit: r.unit, unitKey: r.unitKey, ref: '-',
        slaStartDate: r.slaStartDate, slaTargetHari: r.slaTargetHari,
        slaElapsedHari: r.slaElapsedHari, slaOverdue: r.slaOverdue, slaDone: r.slaDone,
        canEditSla: r.canEditSla
      });
    });
    rows.forEach(function (r) { r.slaStatusLabel = slaStatusLabel(r); });
    return rows;
  }

  function renderMasterSla() {

  // Dipanggil buildDataTable saat PIC menyimpan input Target Hari manual di
  // halaman Master Data SLA. `row` adalah baris gabungan dari buildSlaRows
  // (recordType/underlyingId/gp sudah dibawa serta). Setelah tersimpan,
  // seluruh payload di-refresh dari server (respons updateSlaTargetHari
  // sudah berisi data terbaru) supaya elapsed/overdue ikut terhitung ulang.
  function onSlaTargetHariEdit(row, targetHari, done) {
    google.script.run
      .withSuccessHandler(function (payload) {
        done();
        rawData = payload;
        updateSyncStatus();
        populateFilterOptions();
        populateMasterFilterOptions();
        renderCurrentView();
        showToast('success', 'Target Hari tersimpan.');
      })
      .withFailureHandler(function (err) {
        done();
        showToast('error', 'Gagal menyimpan: ' + (err && err.message ? err.message : err));
      })
      .updateSlaTargetHari({

  // Halaman "Input Progres" (SPV Lapangan, Addendum 7) -- daftar unit yang
  // sudah punya SPK, klik satu unit untuk lihat Kurva S + riwayat (baca-
  // saja) dan (kalau viewer punya scope SPV:<gp> unit itu) input progres
  // minggu ini lengkap dengan minimal MIN_PROGRESS_PHOTOS foto, di-resize
  // di browser lalu di-upload ke Drive oleh server (addProgressRealisasi
  // di Code.gs). TIDAK lagi lewat modal Detail per Unit (lihat
  // openUnitDetail -- section Progres Konstruksi di sana sekarang baca-saja).
  // ---------------------------------------------------------------------
  var PROGRES_UNIT_COLUMNS = [
    { key: 'gp', label: 'Grup Proyek' },
    { key: 'proyek', label: 'Proyek' },
    { key: 'unit', label: 'Blok/Unit' },
    { key: 'jenisSpk', label: 'Jenis SPK' },
    { key: 'mingguTerakhirLabel', label: 'Minggu Terakhir Diisi' },
    { key: 'tanggalTerakhir', label: 'Tanggal Terakhir Diisi' },
    { key: 'persenTerakhirLabel', label: '% Realisasi Terakhir' },
    { key: 'statusLabel', label: 'Status', format: 'progressStatus' }
  ];

  function hasSpvScopeForGp_(gp) {
    var scopes = rawData.meta.viewerScopes || [];
    var wanted = normKey('SPV:' + gp);
    return scopes.some(function (s) { return normKey(s) === wanted; });
  }

  // Satu baris per unit yang punya minimal 1 SPK (bukan tabel SPK mentah)
  // -- digabung dengan progres realisasi terakhir (minggu tertinggi) kalau
  // sudah pernah diisi.
  function buildProgressUnitRows_() {
    var byUnit = {};
    rawData.spk.forEach(function (r) {
      if (!r.unitKey) return;
      if (!byUnit[r.unitKey]) {
        byUnit[r.unitKey] = { unitKey: r.unitKey, gp: r.gp, proyek: r.proyek, unit: r.unit, jenisSpk: r.jenisSpk };
      }
    });
    var lastByUnit = {};
    rawData.progressRealisasi.forEach(function (r) {
      var cur = lastByUnit[r.unitKey];
      if (!cur || r.mingguKe > cur.mingguKe) lastByUnit[r.unitKey] = r;
    });
    return Object.keys(byUnit).map(function (key) {
      var row = byUnit[key];
      var last = lastByUnit[key];
      row.mingguTerakhirLabel = last ? ('Minggu ' + last.mingguKe) : null;
      row.tanggalTerakhir = last ? last.tanggalUpdate : null;
      row.persenTerakhirLabel = last ? (last.realisasiProgres + '%') : null;

      // Status jadwal (Addendum 8): kalau ada data Rencana Progres utk
      // unit ini, nilai berdasar perbandingan kumulatif (lihat
      // computeUnitProgressStatus_) -- kalau tidak ada rencana sama
      // sekali, fallback ke status lama (cuma ada/tidaknya realisasi,
      // tidak bisa dinilai telat/tidaknya).
      var status = computeUnitProgressStatus_(row.unitKey);
      row.isBehindSchedule = !!(status && status.isBehind);
      row.statusLabel = status
        ? (status.isBehind ? 'Tertinggal Jadwal' : 'Sesuai Jadwal')
        : (last ? 'Ada progres' : 'Belum ada progres');
      return row;
    });
  }

  // Resize foto di browser (maks sisi MAX_PROGRESS_PHOTO_DIMENSION px,
  // JPEG quality .8) sebelum di-encode base64 -- supaya payload
  // google.script.run tidak terlalu besar/lambat di koneksi lapangan.
  function resizePhotoToBase64_(file, maxDim, quality, callback) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        var dataUrl = canvas.toDataURL('image/jpeg', quality);
        callback(dataUrl.split(',')[1]);
      };
      img.onerror = function () { callback(null); };
      img.src = e.target.result;
    };
    reader.onerror = function () { callback(null); };
    reader.readAsDataURL(file);
  }

  function wireProgresInputForm_(gp, proyek, unit, unitKey) {
    var form = document.getElementById('progresInputForm');
    if (!form) return;
    var fileInput = document.getElementById('progresInputPhotos');
    var previewEl = document.getElementById('progresInputPhotoPreview');
    var countEl = document.getElementById('progresInputPhotoCount');
    var selectedFiles = [];

    fileInput.addEventListener('change', function () {
      selectedFiles = Array.prototype.slice.call(fileInput.files);
      previewEl.innerHTML = '';
      selectedFiles.forEach(function (file) {
        var img = document.createElement('img');
        img.className = 'photo-thumb';
        img.src = URL.createObjectURL(file);
        previewEl.appendChild(img);
      });
      countEl.textContent = selectedFiles.length + '/' + MIN_PROGRESS_PHOTOS + ' foto';
      countEl.classList.toggle('photo-count-ok', selectedFiles.length >= MIN_PROGRESS_PHOTOS);
    });

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var errorEl = document.getElementById('progresInputError');
      errorEl.hidden = true;

      var mingguKe = Number(document.getElementById('progresInputMinggu').value);
      var realisasi = Number(document.getElementById('progresInputRealisasi').value);
      var keterangan = document.getElementById('progresInputKeterangan').value;

      if (!isFinite(mingguKe) || mingguKe < 1) {
        errorEl.textContent = 'Minggu Ke- harus berupa angka >= 1.'; errorEl.hidden = false; return;
      }
      if (!isFinite(realisasi) || realisasi < 0 || realisasi > 100) {
        errorEl.textContent = 'Realisasi Progres harus berupa angka 0-100.'; errorEl.hidden = false; return;
      }
      if (selectedFiles.length < MIN_PROGRESS_PHOTOS) {
        errorEl.textContent = 'Lampirkan minimal ' + MIN_PROGRESS_PHOTOS + ' foto progres minggu ini.'; errorEl.hidden = false; return;
      }

      var submitBtn = form.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      fileInput.disabled = true;

      var pending = selectedFiles.length;
      var photos = new Array(selectedFiles.length);
      var failed = false;
      selectedFiles.forEach(function (file, idx) {
        resizePhotoToBase64_(file, MAX_PROGRESS_PHOTO_DIMENSION, 0.8, function (base64) {
          if (!base64) failed = true;
          else photos[idx] = { name: file.name || ('foto-' + (idx + 1) + '.jpg'), mimeType: 'image/jpeg', base64: base64 };
          pending--;
          if (pending > 0) return;

          if (failed) {
            submitBtn.disabled = false;
            fileInput.disabled = false;
            errorEl.textContent = 'Gagal memproses salah satu foto. Coba pilih ulang.';
            errorEl.hidden = false;
            return;
          }

          google.script.run
            .withSuccessHandler(function (payload) {
              rawData = payload;
              updateSyncStatus();
              populateFilterOptions();
              populateMasterFilterOptions();
              updateAddButtonsVisibility();
              renderCurrentView();
              showToast('success', 'Progres tersimpan.');
              openProgresInputModal({ unitKey: unitKey, unit: unit, gp: gp, proyek: proyek });
            })
            .withFailureHandler(function (err) {
              submitBtn.disabled = false;
              fileInput.disabled = false;
              errorEl.textContent = err && err.message ? err.message : String(err);
              errorEl.hidden = false;
            })
            .addProgressRealisasi({
              gp: gp, proyek: proyek, unit: unit,
              mingguKe: mingguKe, realisasiProgres: realisasi, keterangan: keterangan,
              photos: photos
            });
        });
      });
    });
  }

  function openProgresInputModal(row) {
    var unitKey = row.unitKey;
    var spkList = rawData.spk.filter(function (r) { return r.unitKey === unitKey; });
    var gp = spkList.length ? spkList[0].gp : row.gp;
    var proyek = row.proyek;
    var unit = row.unit;
    var canEdit = hasSpvScopeForGp_(gp);

    var rencanaList = rawData.progressRencana.filter(function (r) { return r.unitKey === unitKey; })
      .sort(function (a, b) { return a.mingguKe - b.mingguKe; });
    var realisasiList = rawData.progressRealisasi.filter(function (r) { return r.unitKey === unitKey; })
      .sort(function (a, b) { return a.mingguKe - b.mingguKe; });

    var progressStatus = computeUnitProgressStatus_(unitKey);

    var html = '<div class="unit-header"><h2>' + escapeHtml(unit) + '</h2>' +
      '<p>' + escapeHtml(gp) + ' · ' + escapeHtml(proyek) + '</p></div>';

    html += '<div class="unit-section"><h4>Kurva S &amp; Riwayat Progres' +
      (progressStatus && progressStatus.isBehind
        ? ' <span class="badge badge-red">Tertinggal Jadwal</span>'
        : (progressStatus ? ' <span class="badge badge-green">Sesuai Jadwal</span>' : '')) +
      '</h4>';
    if (progressStatus && progressStatus.isBehind) {
      html += '<p class="unit-empty">Rencana kumulatif s/d minggu ke-' + progressStatus.evalWeek + ' seharusnya ' +
        progressStatus.plannedCumulative.toFixed(1) + '%, realisasi baru ' + progressStatus.actualCumulative.toFixed(1) +
        '% (tertinggal ' + progressStatus.gap.toFixed(1) + '%).</p>';
    }
    var rencanaAgg = aggregateRencanaByWeek_(rencanaList);
    var weekMap = {};
    rencanaAgg.forEach(function (r) {
      weekMap[r.mingguKe] = weekMap[r.mingguKe] || {};
      weekMap[r.mingguKe].rencana = r.rencanaProgres;
    });
    realisasiList.forEach(function (r) {
      weekMap[r.mingguKe] = weekMap[r.mingguKe] || {};
      weekMap[r.mingguKe].realisasi = r.realisasiProgres;
      weekMap[r.mingguKe].tanggalUpdate = r.tanggalUpdate;
      weekMap[r.mingguKe].keterangan = r.keterangan;
      weekMap[r.mingguKe].lampiranFoto = r.lampiranFoto;
    });
    var weekKeys = Object.keys(weekMap).map(Number).sort(function (a, b) { return a - b; });

    if (weekKeys.length) {
      html += '<div class="unit-item"><div class="progress-chart-wrap"><canvas id="progresInputChart"></canvas></div>' +
        weekKeys.map(function (wk) {
          var w = weekMap[wk];
          var fotoCount = w.lampiranFoto ? w.lampiranFoto.split(',').filter(function (s) { return s.trim(); }).length : 0;
          return '<div class="unit-item-meta">Minggu ' + wk + ': Rencana ' +
            (w.rencana != null ? w.rencana + '%' : '–') + rencanaItemsLabel_(rencanaList, wk) + ' · Realisasi ' +
            (w.realisasi != null ? w.realisasi + '%' : '–') +
            (w.tanggalUpdate ? ' (' + formatDate(w.tanggalUpdate) + ')' : '') +
            (w.keterangan ? ' · ' + escapeHtml(w.keterangan) : '') +
            (fotoCount ? ' · 📷 ' + fotoCount + ' foto' : '') + '</div>';
        }).join('') + '</div>';
    } else {
      html += '<p class="unit-empty">Belum ada rencana/realisasi progres untuk unit ini.</p>';
    }
    html += '</div>';

    html += '<div class="unit-section"><h4>Input Progres Minggu Ini</h4>';
    if (!spkList.length) {
      html += '<p class="unit-empty">Unit ini belum punya SPK — progres belum bisa diinput.</p>';
    } else if (!canEdit) {
      html += '<p class="unit-empty">Anda tidak berwenang menginput progres konstruksi untuk ' + escapeHtml(gp) + '.</p>';
    } else {
      html += '<form id="progresInputForm" class="form-grid progress-form">' +
        '<div class="form-field"><label>Minggu Ke- <span class="required-mark">*</span></label>' +
        '<input type="number" id="progresInputMinggu" min="1" step="1"></div>' +
        '<div class="form-field"><label>Realisasi Progres (%) <span class="required-mark">*</span></label>' +
        '<input type="number" id="progresInputRealisasi" min="0" max="100" step="any"></div>' +
        '<div class="form-field form-field-wide"><label>Keterangan</label>' +
        '<input type="text" id="progresInputKeterangan"></div>' +
        '<div class="form-field form-field-wide"><label>Foto Lapangan (minimal ' + MIN_PROGRESS_PHOTOS + ' foto) <span class="required-mark">*</span></label>' +
        '<input type="file" id="progresInputPhotos" accept="image/*" multiple capture="environment">' +
        '<div class="photo-preview-grid" id="progresInputPhotoPreview"></div>' +
        '<div class="photo-count" id="progresInputPhotoCount">0/' + MIN_PROGRESS_PHOTOS + ' foto</div></div>' +
        '<div class="form-actions"><button type="submit" class="btn-primary">Simpan Progres</button></div>' +
        '</form><div class="form-error" id="progresInputError" hidden></div>';
    }
    html += '</div>';

    document.getElementById('progresInputModalContent').innerHTML = html;
    document.getElementById('progresInputModalBackdrop').classList.add('open');

    if (weekKeys.length) {
      renderUnitProgressChart_(
        weekKeys,
        buildCumulativeAtWeeks_(rencanaAgg, weekKeys, 'rencanaProgres'),
        buildCumulativeAtWeeks_(realisasiList, weekKeys, 'realisasiProgres'),
        'progresInputProgress', 'progresInputChart'
      );
    }
    if (spkList.length && canEdit) wireProgresInputForm_(gp, proyek, unit, unitKey);
  }

  // Kurva S sederhana: rencanaProgres/realisasiProgres yang tersimpan di
  // Sheets adalah persentase MINGGUAN (bukan kumulatif) -- dijumlahkan di
  // sini jadi kumulatif, sepanjang gabungan minggu yang benar-benar punya
  // data (weekKeys), supaya rencana & realisasi tetap sejajar di chart
  // walau realisasi baru terisi sebagian dari rencana.
  function buildCumulativeAtWeeks_(list, weekKeys, key) {
    var byWeek = {};
    list.forEach(function (r) { byWeek[r.mingguKe] = r[key]; });
    var sum = 0;
    return weekKeys.map(function (wk) {
      if (byWeek[wk] != null) sum += byWeek[wk];
      return sum;
    });
  }

  // Addendum 8: "Rencana Progres" sekarang satu baris per (unit, minggu,
  // item pekerjaan) -- rencanaProgres di tiap baris adalah bobot mingguan
  // ITEM itu saja, bukan total minggu. Jumlahkan per minggu dulu sebelum
  // dipakai buildCumulativeAtWeeks_/ditampilkan sbg total mingguan.
  function aggregateRencanaByWeek_(rencanaList) {
    var byWeek = {};
    var order = [];
    rencanaList.forEach(function (r) {
      if (byWeek[r.mingguKe] === undefined) { byWeek[r.mingguKe] = 0; order.push(r.mingguKe); }
      byWeek[r.mingguKe] += (r.rencanaProgres || 0);
    });
    return order.map(function (wk) { return { mingguKe: wk, rencanaProgres: byWeek[wk] }; });
  }

  // Label "(Item A: 2,5%, Item B: 1,3%)" utk satu minggu -- dipakai
  // menampilkan rincian item pekerjaan di baris riwayat Progres Konstruksi.
  function rencanaItemsLabel_(rencanaList, mingguKe) {
    var items = rencanaList.filter(function (r) { return r.mingguKe === mingguKe && r.uraianPekerjaan; });
    if (!items.length) return '';
    return ' (' + items.map(function (r) { return escapeHtml(r.uraianPekerjaan) + ': ' + r.rencanaProgres + '%'; }).join(', ') + ')';
  }

  // String "YYYY-MM-DD" -> Date lokal (bukan UTC midnight spt `new
  // Date(iso)`), konsisten dgn parseDateCell di Utils.gs backend.
  function parseIsoDate_(iso) {
    if (!iso) return null;
    var p = String(iso).split('-');
    if (p.length !== 3) return null;
    return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  }

  // Status "tertinggal jadwal" per unit (Addendum 8) -- bandingkan Rencana
  // KUMULATIF s/d minggu yang SEHARUSNYA sudah dicapai hari ini (dihitung
  // dari SPK terbit paling awal unit itu, 1 minggu = 7 hari kalender)
  // terhadap Realisasi KUMULATIF yang benar-benar sudah dilaporkan sejauh
  // ini. Sengaja pakai kumulatif (bukan per-minggu-yang-sudah-diisi saja)
  // supaya unit yang belum sempat dilaporkan SPV minggu ini tetap ke-flag
  // kalau memang sudah telat, bukan cuma "belum lapor".
  // Return null kalau tidak bisa dinilai (unit belum ada SPK, atau tab
  // Rencana Progres belum diisi utk unit itu).
  function computeUnitProgressStatus_(unitKey) {
    if (!unitKey) return null;
    var spkList = rawData.spk.filter(function (r) { return r.unitKey === unitKey; });
    if (!spkList.length) return null;

    var startIso = null;
    spkList.forEach(function (r) {
      if (r.tanggalTerbit && (!startIso || r.tanggalTerbit < startIso)) startIso = r.tanggalTerbit;
    });
    var start = parseIsoDate_(startIso);
    if (!start) return null;

    var rencanaList = rawData.progressRencana.filter(function (r) { return r.unitKey === unitKey; });
    if (!rencanaList.length) return null;
    var rencanaAgg = aggregateRencanaByWeek_(rencanaList);
    var maxScheduledWeek = rencanaAgg.reduce(function (m, r) { return Math.max(m, r.mingguKe); }, 0);
    if (!maxScheduledWeek) return null;

    var today = new Date();
    today = new Date(today.getFullYear(), today.getMonth(), today.getDate());
    var daysElapsed = Math.floor((today.getTime() - start.getTime()) / 86400000);
    var expectedWeek = Math.floor(daysElapsed / 7) + 1;
    if (expectedWeek < 1) expectedWeek = 1;
    var evalWeek = Math.min(expectedWeek, maxScheduledWeek);

    var plannedCumulative = 0;
    rencanaAgg.forEach(function (r) { if (r.mingguKe <= evalWeek) plannedCumulative += r.rencanaProgres; });

    var realisasiList = rawData.progressRealisasi.filter(function (r) { return r.unitKey === unitKey; });
    var actualCumulative = realisasiList.reduce(function (s, r) { return s + r.realisasiProgres; }, 0);

    var EPS = 0.05; // toleransi pembulatan kecil
    return {
      expectedWeek: expectedWeek,
      evalWeek: evalWeek,
      maxScheduledWeek: maxScheduledWeek,
      plannedCumulative: plannedCumulative,
      actualCumulative: actualCumulative,
      gap: plannedCumulative - actualCumulative,
      isBehind: plannedCumulative > actualCumulative + EPS
    };
  }

  function renderUnitProgressChart_(weekKeys, rencanaCum, realisasiCum, chartKey, canvasId) {
    chartKey = chartKey || 'unitProgress';
    canvasId = canvasId || 'unitProgressChart';
    destroyChart(chartKey);
    var canvas = document.getElementById(canvasId);
    if (!canvas) return;
    charts[chartKey] = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: {
        labels: weekKeys.map(function (wk) { return 'M' + wk; }),
        datasets: [
          { label: 'Rencana (%)', data: rencanaCum, borderColor: '#5b6b7c', backgroundColor: 'transparent', tension: 0.2 },
          { label: 'Realisasi (%)', data: realisasiCum, borderColor: '#1f9d55', backgroundColor: 'transparent', tension: 0.2 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { y: { beginAtZero: true, max: 100, ticks: { callback: function (v) { return v + '%'; } } } },
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
      }
    });
  }

    if (spkList.length && weekKeys && weekKeys.length) {

        buildCumulativeAtWeeks_(realisasiList, weekKeys, 'realisasiProgres')
      );
    }
  }

    if (recordType === 'spk') {
      var gpField = document.createElement('div');
      gpField.className = 'form-field';
      var gpLabel = document.createElement('label');
      gpLabel.innerHTML = 'Grup Proyek <span class="required-mark">*</span>';
      var gpSelect = document.createElement('select');
      (opts.allowedGps || []).forEach(function (gp) {
        var o = document.createElement('option'); o.value = gp; o.textContent = gp; gpSelect.appendChild(o);
      });
      if (opts.lockedGp) { gpSelect.value = opts.lockedGp; gpSelect.disabled = true; }
      gpField.appendChild(gpLabel);
      gpField.appendChild(gpSelect);
      form.appendChild(gpField);
      inputs.__gp = gpSelect;
    }

    var namaProyekDatalist = null;
    defs.forEach(function (def) {
      var field = document.createElement('div');
      field.className = 'form-field' + (def.wide ? ' form-field-wide' : '');
      var label = document.createElement('label');
      label.innerHTML = escapeHtml(def.label) + (def.required ? ' <span class="required-mark">*</span>' : '');
      field.appendChild(label);

      // Lampiran boleh diisi lebih dari satu -- daftar baris input yang
      // bisa ditambah/dikurangi, digabung jadi satu string dipisah ", "
      // saat submit (kolom Sheets-nya tetap satu sel teks).
      if (def.type === 'multitext') {
        var listEl = document.createElement('div');
        listEl.className = 'multitext-list';
        function addMultitextRow() {
          var row = document.createElement('div');
          row.className = 'multitext-row';
          var rowInput = document.createElement('input');
          rowInput.type = 'text';
          rowInput.placeholder = 'Link/nama file bukti';
          var removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.className = 'multitext-remove';
          removeBtn.textContent = '×';
          removeBtn.setAttribute('aria-label', 'Hapus baris lampiran');
          removeBtn.addEventListener('click', function () { row.remove(); });
          row.appendChild(rowInput);
          row.appendChild(removeBtn);
          listEl.appendChild(row);
        }
        addMultitextRow();
        var addRowBtn = document.createElement('button');
        addRowBtn.type = 'button';
        addRowBtn.className = 'multitext-add';
        addRowBtn.textContent = '+ Tambah Lampiran';
        addRowBtn.addEventListener('click', addMultitextRow);
        field.appendChild(listEl);
        field.appendChild(addRowBtn);
        form.appendChild(field);
        inputs[def.key] = {
          get value() {
            var vals = [];
            listEl.querySelectorAll('input').forEach(function (inp) {
              var v = inp.value.trim();
              if (v) vals.push(v);
            });
            return vals.join(', ');
          }
        };
        return;
      }

      var input;
      if (def.type === 'select') {
        input = document.createElement('select');
        var placeholderOpt = document.createElement('option');
        placeholderOpt.value = '';
        placeholderOpt.textContent = '– Pilih –';
        input.appendChild(placeholderOpt);
        def.options.forEach(function (v) {
          var o = document.createElement('option'); o.value = v; o.textContent = v; input.appendChild(o);
        });
      } else if (def.type === 'textarea') {
        input = document.createElement('textarea');
        input.rows = 3;
      } else {
        input = document.createElement('input');
        input.type = def.type === 'number' ? 'number' : (def.type === 'date' ? 'date' : 'text');
        if (def.type === 'number') input.step = 'any';
        if (def.datalist) {
          input.setAttribute('list', 'addRecordProyekList');
          namaProyekDatalist = namaProyekDatalist || document.createElement('datalist');
          namaProyekDatalist.id = 'addRecordProyekList';
        }
      }
      field.appendChild(input);
      form.appendChild(field);
      inputs[def.key] = input;
    });

    if (namaProyekDatalist) form.appendChild(namaProyekDatalist);

    // Datalist Nama Proyek menyesuaikan GP yang dipilih (proyekOptionsForGp
    // sudah ada, dipakai juga oleh filter Master Data) -- bantu cegah typo
    // tanpa mengunci ke daftar lama.
    function refreshProyekDatalist() {
      if (!namaProyekDatalist) return;
      var gpForProyek = inputs.__gp ? inputs.__gp.value : (inputs.grupProyek ? inputs.grupProyek.value : '');
      namaProyekDatalist.innerHTML = '';
      proyekOptionsForGp(gpForProyek).forEach(function (p) {
        var o = document.createElement('option'); o.value = p; namaProyekDatalist.appendChild(o);
      });
    }
    refreshProyekDatalist();
    if (inputs.__gp && !opts.lockedGp) inputs.__gp.addEventListener('change', refreshProyekDatalist);
    if (inputs.grupProyek) inputs.grupProyek.addEventListener('change', refreshProyekDatalist);

    var errorEl = document.createElement('div');
    errorEl.className = 'form-error';
    errorEl.hidden = true;

    var actions = document.createElement('div');
    actions.className = 'form-actions';
    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button'; cancelBtn.className = 'btn-secondary'; cancelBtn.textContent = 'Batal';
    cancelBtn.addEventListener('click', closeAddRecordModal);
    var submitBtn = document.createElement('button');
    submitBtn.type = 'submit'; submitBtn.className = 'btn-primary'; submitBtn.textContent = 'Simpan';
    actions.appendChild(cancelBtn);
    actions.appendChild(submitBtn);
    form.appendChild(actions);

    container.appendChild(form);
    container.appendChild(errorEl);

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      errorEl.hidden = true;

      var fields = {};
      var missing = [];
      defs.forEach(function (def) {
        var el = inputs[def.key];
        var val = el.value;
        if (def.required && !val) missing.push(def.label);
        fields[def.key] = (def.type === 'number') ? (val === '' ? '' : Number(val)) : val;
      });
      var gpValue = inputs.__gp ? inputs.__gp.value : fields.grupProyek;
      if (recordType === 'spk' && !gpValue) missing.push('Grup Proyek');

      if (missing.length) {
        errorEl.textContent = 'Wajib diisi: ' + missing.join(', ') + '.';
        errorEl.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      opts.onSubmit(gpValue, fields, function (errMessage) {
        submitBtn.disabled = false;
        if (errMessage) {
          errorEl.textContent = errMessage;
          errorEl.hidden = false;
        }
      });
    });
  }

  function openAddRecordModal(recordType) {
    var lockedGp = '';
    var allowedGps = [];
    if (recordType === 'spk') {
      (rawData.meta.viewerScopes || []).forEach(function (s) {
        var m = /^SPK:(.+)$/i.exec(String(s).trim());
        if (m) allowedGps.push(m[1]);
      });
      if (!allowedGps.length) { showToast('error', 'Anda tidak punya scope SPK untuk GP manapun.'); return; }
      if (masterSpkGp && allowedGps.indexOf(masterSpkGp) !== -1) lockedGp = masterSpkGp;
    }

    buildAddRecordForm({
      recordType: recordType,
      containerEl: document.getElementById('addRecordModalContent'),
      lockedGp: lockedGp,
      allowedGps: allowedGps,
      onSubmit: function (gp, fields, done) {
        google.script.run
          .withSuccessHandler(function (payload) {
            done();
            rawData = payload;
            updateSyncStatus();
            populateFilterOptions();
            populateMasterFilterOptions();
            updateAddButtonsVisibility();
            renderCurrentView();
            closeAddRecordModal();
            showToast('success', 'Data tersimpan.');
          })
          .withFailureHandler(function (err) {
            done(err && err.message ? err.message : String(err));
          })
          .addRecord({ recordType: recordType, gp: gp, fields: fields });
      }
    });

    document.getElementById('addRecordModalBackdrop').classList.add('open');
  }

  function closeAddRecordModal() {
    document.getElementById('addRecordModalBackdrop').classList.remove('open');
  }
  document.getElementById('addRecordModalClose').addEventListener('click', closeAddRecordModal);
  document.getElementById('addRecordModalBackdrop').addEventListener('click', function (e) {
    if (e.target === document.getElementById('addRecordModalBackdrop')) closeAddRecordModal();
  });

  // Tombol "+ Tambah Data" hanya tampil kalau viewer punya scope yang
  // relevan (dari meta.viewerScopes, lihat buildDashboardPayload_ di
  // DataService.gs) -- dipanggil ulang tiap kali rawData berganti.
  function updateAddButtonsVisibility() {
    var scopes = rawData.meta.viewerScopes || [];
    var hasSpkScope = scopes.some(function (s) { return /^SPK:/i.test(String(s).trim()); });
    var hasPurScope = scopes.some(function (s) { return normKey(s) === 'PURCHASING'; });
    var hasHwaScope = scopes.some(function (s) { return normKey(s) === 'HOMEWITHAI'; });
    var hasWifiScope = scopes.some(function (s) { return normKey(s) === 'PEMBELIANWIFI'; });
    document.getElementById('addSpkBtn').hidden = !hasSpkScope;
    document.getElementById('addPurBtn').hidden = !hasPurScope;
    document.getElementById('addHwaBtn').hidden = !hasHwaScope;
    document.getElementById('addWifiBtn').hidden = !hasWifiScope;
  }

  document.getElementById('addSpkBtn').addEventListener('click', function () { openAddRecordModal('spk'); });
  document.getElementById('addPurBtn').addEventListener('click', function () { openAddRecordModal('purchasing'); });
  document.getElementById('addHwaBtn').addEventListener('click', function () { openAddRecordModal('homeWithAi'); });
  document.getElementById('addWifiBtn').addEventListener('click', function () { openAddRecordModal('pembelianWifi'); });

  // ---------------------------------------------------------------------
  // Global controls
  // ---------------------------------------------------------------------
  document.getElementById('refreshBtn').addEventListener('click', function () { loadData(false); });

  var searchDebounce = null;
  document.getElementById('filterSearch').addEventListener('input', function (e) {
    var val = e.target.value;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(function () { filters.search = val; renderAll(); }, 250);
  });

  document.getElementById('resetFiltersBtn').addEventListener('click', function () {
    filters = { kategori: { 'SPK': true, 'Purchasing': true, 'Home With AI': true }, tahun: '', bulan: '', gp: '', proyek: '', search: '' };
    document.getElementById('filterSearch').value = '';
    populateFilterOptions();
    renderAll();
  });

  // ---------------------------------------------------------------------
  // Init
  // ---------------------------------------------------------------------
  syncStickyOffsets();
  loadData(true);
  scheduleAutoRefresh();
})();
</script>
